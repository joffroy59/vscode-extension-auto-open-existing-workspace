name: Publish VSIX

on:
  workflow_run:
    workflows:
      - Release VSIX
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Actions run ID for the successful Release VSIX run
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download VSIX from release workflow
        uses: actions/download-artifact@v4
        with:
          name: extension-vsix
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.inputs.release_run_id || github.event.workflow_run.id }}

      - name: Publish to VS Code Marketplace
        run: |
          vsix_file="$(find dist -maxdepth 1 -name '*.vsix' -print -quit)"
          test -n "$vsix_file"
          npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath "$vsix_file"