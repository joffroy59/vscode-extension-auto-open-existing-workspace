name: Release VSIX

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify release tag matches extension version
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const expectedTag = `v${version}`;

          if (process.env.RELEASE_TAG !== expectedTag) {
            console.error(`Release tag must be ${expectedTag}, received ${process.env.RELEASE_TAG}.`);
            process.exit(1);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE

      - name: Package extension
        run: >-
          npx --yes @vscode/vsce package
          --no-dependencies
          --allow-star-activation
          --out "vscode-extension-autoopen-existing-workspace-${{ steps.metadata.outputs.version }}.vsix"

      - name: Upload VSIX for Marketplace publishing
        uses: actions/upload-artifact@v7
        with:
          name: extension-vsix
          path: vscode-extension-autoopen-existing-workspace-${{ steps.metadata.outputs.version }}.vsix
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: vscode-extension-autoopen-existing-workspace-${{ steps.metadata.outputs.version }}.vsix